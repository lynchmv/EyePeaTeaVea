services:
  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - eyepeateavea_network

  app:
    build:
      context: .
      args:
        CLONE_TV_LOGOS: ${CLONE_TV_LOGOS:-false}  # Set CLONE_TV_LOGOS=true in .env or pass via command line
        CLONE_TEAM_LOGOS: ${CLONE_TEAM_LOGOS:-true}  # Set CLONE_TEAM_LOGOS=true in .env for sports team logos
    ports:
      - "8020:8020"
    environment:
      REDIS_URL: redis://redis:6379/0
      HOST_URL: https://stremio-dev.lynuxss.com
      # TV_LOGOS_REPO_PATH is set in Dockerfile, but can be overridden here if needed
      # TV_LOGOS_REPO_PATH: /app/tv-logos
      # Disable SSL verification for problematic CDNs (set via .env)
      DISABLE_SSL_VERIFY: ${DISABLE_SSL_VERIFY:-true}
      # ADDON_PASSWORD: your_addon_password # Uncomment and set in .env for production
      # Observability settings
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
    depends_on:
      - redis
    networks:
      - eyepeateavea_network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.51.0
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.external-url=https://stremio-dev.lynuxss.com/prometheus/'
      - '--web.route-prefix=/'
    depends_on:
      - app
    networks:
      - eyepeateavea_network

volumes:
  redis_data:
  prometheus_data:

networks:
  eyepeateavea_network:
    driver: bridge
